<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Election Admin</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="wrap admin"><a href="/">← Back to election</a><h1>Election control room<span class="accent">.</span></h1><p id="adminMsg">Admin sign-in required</p><form id="adminLogin" class="modalcard" style="margin:20px 0"><label>ADMIN USERNAME<input id="adminUsername" required autocomplete="username"></label><label>ADMIN PASSWORD<input id="adminPassword" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in as admin</button></form><button class="smallbtn hidden" id="adminLogout">Admin logout</button><div id="adminPanel" class="hidden"><div class="metric"><span>ANONYMOUS VOTES</span><strong id="registered">0</strong></div><div class="metric"><span>VOTES CAST</span><strong id="cast">0</strong></div><h2>Voting status</h2><div class="adminbuttons"><button data-status="open">Open voting</button><button data-status="paused">Pause voting</button><button data-status="closed">Close election</button></div><p id="currentStatus"></p><div id="adminCounts"></div></div></main><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="/static/js/admin.js"></script></body></html>
